# Prince Byron — isolated local development services
# Run: docker compose up -d
# Stop: docker compose down
# DB only: docker compose up -d db
#
# This compose file is for LOCAL DEVELOPMENT ONLY.
# Never use these credentials or this configuration in production.

services:
  app:
    build:
      context: ./core
      dockerfile: Dockerfile
    container_name: princebyron_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: 'true'
      APP_KEY: base64:$(openssl rand -base64 32)
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-princebyron}
      DB_USERNAME: ${DB_USERNAME:-princebyron}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./core:/var/www/html
    command: php artisan serve --host=0.0.0.0 --port=8000

  db:
    image: postgres:17-alpine
    container_name: princebyron_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-princebyron}
      POSTGRES_USER: ${DB_USERNAME:-princebyron}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - princebyron_pgdata:/var/lib/postgresql/data
    ports:
      # Host port 5437 is free; avoids all existing project containers.
      - "127.0.0.1:5437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-princebyron} -d ${DB_DATABASE:-princebyron}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: princebyron_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - princebyron_redis:/data
    ports:
      # Host port 6383 is free
      - "127.0.0.1:6383:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    container_name: princebyron_mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"   # SMTP
      - "127.0.0.1:8025:8025"   # Web UI
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8025/api/v1/info"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  princebyron_pgdata:
    driver: local
  princebyron_redis:
    driver: local
